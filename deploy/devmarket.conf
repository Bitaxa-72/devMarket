server {
    listen 80;
    listen [::]:80;
    server_name testvitalydomen.ru www.testvitalydomen.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://testvitalydomen.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.testvitalydomen.ru;
    ssl_certificate /etc/letsencrypt/live/testvitalydomen.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testvitalydomen.ru/privkey.pem;

    return 301 https://testvitalydomen.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name testvitalydomen.ru;
    ssl_certificate /etc/letsencrypt/live/testvitalydomen.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testvitalydomen.ru/privkey.pem;
    root /var/www/devmarket/current;
    index index.html;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

server {
    listen 8083;
    listen [::]:8083;
    server_name _;
    root /var/www/devmarket/current;
    index index.html;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
